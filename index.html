<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu Linh Tran — Product Design Student</title>
    <meta
      name="description"
      content="Portfolio of Tu Linh Tran, interface design student working on UX/UI, HCI and research. Open for internships from April 2027."
    />

    <!-- Tab icon (drawn ⁑, adapts to light/dark) and iPhone home-screen icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Colour of the browser's address bar on phones, per theme. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!--
      Share preview ("Open Graph"): what LinkedIn, WhatsApp, Slack, iMessage
      etc. show when someone pastes your link. These tools read this file
      as it is, without running JavaScript, so every page shares this one
      preview. og:image must be a full URL including the domain.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tu Linh Tran" />
    <meta property="og:title" content="Tu Linh Tran — Interface Design Student" />
    <meta
      property="og:description"
      content="UX/UI, HCI and research. Open for internships from April 2027."
    />
    <meta property="og:url" content="https://tulinhtran.com/" />
    <meta property="og:image" content="https://tulinhtran.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tu Linh Tran, Interface Design Student, UX/UI and Research. Open for internships from April 2027."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Theme script: runs BEFORE the page is drawn.
      If it ran later (inside React), a dark-mode visitor would first see
      the white page for a split second, then flip to dark ("flash").
      It picks the saved choice if there is one, otherwise the system setting,
      and writes it to <html data-theme="...">. All colors in tokens.css
      react to that attribute.
    -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <!-- React renders the whole app inside this div. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
